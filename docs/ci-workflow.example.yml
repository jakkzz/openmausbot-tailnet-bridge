name: Tests (no publication)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-and-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bash launcher syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/pair-phone.command
      - name: Ubuntu race suite
        if: runner.os == 'Linux'
        run: go test -race -timeout 120s ./...
      - name: Windows suite including generation pipe fixtures
        if: runner.os == 'Windows'
        run: go test -v -timeout 120s ./...
      - name: Cross-build Windows amd64 and compile fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-H=windowsgui' -o artifacts/bridge.exe .
          GOOS=windows GOARCH=amd64 go test -c -o artifacts/bridge.test.exe .
      - name: Python syntax and portable unit tests
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools -v
      - name: PowerShell syntax (does not install anything)
        shell: pwsh
        run: ./scripts/check-powershell.ps1
  mac-qr:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -v
